name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install quality tooling
        run: python -m pip install --upgrade pip pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Compile integration
        run: python -m compileall -q custom_components/ideenergy

  tests:
    name: Home Assistant ${{ matrix.homeassistant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - homeassistant: "2026.3.1"
            pytest_homeassistant: "0.13.317"
          - homeassistant: "2026.9.1"
            pytest_homeassistant: "0.13.364"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pytest-homeassistant-custom-component==${{ matrix.pytest_homeassistant }}" \
            "ideenergy>=2.0.1.dev3" \
            "homeassistant-historical-sensor==3.0.0a4"

      - name: Verify Home Assistant version
        run: |
          python - <<'PY'
          from homeassistant.const import __version__

          expected = "${{ matrix.homeassistant }}"
          if __version__ != expected:
              raise SystemExit(f"expected Home Assistant {expected}, got {__version__}")
          PY

      - name: Run tests
        run: python -m pytest -q
