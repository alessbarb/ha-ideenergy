name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install quality tooling
        run: python -m pip install --upgrade pip pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Compile integration
        run: python -m compileall -q custom_components/ideenergy

  release-metadata:
    name: Release Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Verify version and pinned client
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          manifest = json.loads(Path("custom_components/ideenergy/manifest.json").read_text())
          with Path("pyproject.toml").open("rb") as file:
              project = tomllib.load(file)

          manifest_version = manifest["version"]
          project_version = project["project"]["version"]
          if manifest_version != project_version:
              raise SystemExit(
                  f"version mismatch: manifest={manifest_version}, pyproject={project_version}"
              )

          if not re.fullmatch(r"\d+\.\d+\.\d+(?:(?:a|b|rc)\d+)?", manifest_version):
              raise SystemExit(f"unsupported integration version format: {manifest_version}")

          client_requirements = [
              requirement
              for requirement in manifest["requirements"]
              if requirement.startswith("ideenergy@git+")
          ]
          if len(client_requirements) != 1:
              raise SystemExit("manifest must contain exactly one immutable ideenergy Git requirement")

          client_requirement = client_requirements[0]
          if not re.fullmatch(
              r"ideenergy@git\+https://github\.com/alessbarb/ideenergy\.git@[0-9a-f]{40}",
              client_requirement,
          ):
              raise SystemExit(f"ideenergy requirement is not pinned to a full SHA: {client_requirement}")

          ref = os.environ.get("GITHUB_REF", "")
          if ref.startswith("refs/tags/"):
              tag = ref.removeprefix("refs/tags/")
              expected_tag = f"v{manifest_version}"
              if tag != expected_tag:
                  raise SystemExit(f"tag mismatch: expected {expected_tag}, got {tag}")

          print(f"release metadata valid for {manifest_version}")
          PY

  tests:
    name: Home Assistant ${{ matrix.homeassistant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - homeassistant: "2026.3.1"
            pytest_homeassistant: "0.13.317"
          - homeassistant: "2026.9.1"
            pytest_homeassistant: "0.13.364"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pytest-homeassistant-custom-component==${{ matrix.pytest_homeassistant }}" \
            "ideenergy@git+https://github.com/alessbarb/ideenergy.git@c16442d36a5b59f6d3f895ebdd722654bf54fcf1" \
            "homeassistant-historical-sensor==3.0.0a4"

      - name: Verify Home Assistant version
        run: |
          python - <<'PY'
          from homeassistant.const import __version__

          expected = "${{ matrix.homeassistant }}"
          if __version__ != expected:
              raise SystemExit(f"expected Home Assistant {expected}, got {__version__}")
          PY

      - name: Run tests
        run: python -m pytest -q
