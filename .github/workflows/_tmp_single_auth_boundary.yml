name: Temporary single auth boundary patch

on:
  push:
    branches:
      - fix/single-auth-boundary

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/single-auth-boundary
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Delegate auth recovery to ideenergy
        run: |
          python - <<'PY'
          from pathlib import Path

          coordinator = Path("custom_components/ideenergy/coordinator.py")
          text = coordinator.read_text()
          old = '''    async def _async_call_client(self, afn: Callable, *args, **kwargs):\n        \"\"\"Call an authenticated client endpoint with one bounded auth retry.\n\n        The coordinator must not keep the remote session alive merely because\n        Home Assistant is running. A login happens only immediately before a\n        real data request when the local session has expired. If i-DE rejects\n        an otherwise locally-valid session with HTTP 401/403, authenticate\n        once and retry the original operation once. Transient server failures\n        are deliberately propagated to DataUpdateCoordinator instead of being\n        converted into login loops.\n        \"\"\"\n        if not self._client.is_logged:\n            await self._client.login()\n\n        try:\n            return await afn(*args, **kwargs)\n        except ideenergy.RequestFailedError as exc:\n            status = getattr(exc.response, \"status\", None)\n            if status not in (401, 403):\n                raise\n\n            await self._client.login()\n            return await afn(*args, **kwargs)\n'''
          new = '''    async def _async_call_client(self, afn: Callable, *args, **kwargs):\n        \"\"\"Call the client and leave auth recovery to ideenergy.\"\"\"\n        return await afn(*args, **kwargs)\n'''
          if text.count(old) != 1:
              raise SystemExit("unexpected coordinator auth helper implementation")
          coordinator.write_text(text.replace(old, new))

          tests = Path("tests/test_coordinator_session.py")
          text = tests.read_text()
          old_due = '''async def test_due_dataset_logs_in_only_for_real_request(hass):\n    client = make_client(is_logged=False)\n    client.get_measure.return_value = ideenergy.Measure(accumulate=123, instant=4.5)\n    state = make_state()\n    coordinator = make_coordinator(hass, client, state)\n    coordinator.dataset_counter[IDeEnergyCoordinatorDataSet.DIRECT_READING.name] = 1\n\n    data = await coordinator._async_update_data()\n\n    client.login.assert_awaited_once_with()\n    client.renew_session.assert_not_awaited()\n    client.get_measure.assert_awaited_once_with()\n    assert data[IDeEnergyCoordinatorDataSet.DIRECT_READING] == {\n        MEASURE_ACCUMULATED_KEY: 123,\n        MEASURE_INSTANT_KEY: 4.5,\n    }\n    assert DIRECT_READING_LAST_SUCCESS_STORED_STATE_KEY in state.data\n\n\nasync def test_403_reauthenticates_once_and_retries_once(hass):\n    response = Mock(status=403, reason=\"Forbidden\")\n    client = make_client(is_logged=True)\n    client.get_measure.side_effect = [\n        ideenergy.RequestFailedError(response),\n        ideenergy.Measure(accumulate=321, instant=1.25),\n    ]\n    state = make_state()\n    coordinator = make_coordinator(hass, client, state)\n    coordinator.dataset_counter[IDeEnergyCoordinatorDataSet.DIRECT_READING.name] = 1\n\n    data = await coordinator._async_update_data()\n\n    client.login.assert_awaited_once_with()\n    assert client.get_measure.await_count == 2\n    assert (\n        data[IDeEnergyCoordinatorDataSet.DIRECT_READING][MEASURE_ACCUMULATED_KEY] == 321\n    )\n\n\n'''
          new_due = '''async def test_due_dataset_calls_client_once(hass):\n    client = make_client(is_logged=False)\n    client.get_measure.return_value = ideenergy.Measure(accumulate=123, instant=4.5)\n    state = make_state()\n    coordinator = make_coordinator(hass, client, state)\n    coordinator.dataset_counter[IDeEnergyCoordinatorDataSet.DIRECT_READING.name] = 1\n\n    data = await coordinator._async_update_data()\n\n    client.login.assert_not_awaited()\n    client.renew_session.assert_not_awaited()\n    client.get_measure.assert_awaited_once_with()\n    assert data[IDeEnergyCoordinatorDataSet.DIRECT_READING] == {\n        MEASURE_ACCUMULATED_KEY: 123,\n        MEASURE_INSTANT_KEY: 4.5,\n    }\n    assert DIRECT_READING_LAST_SUCCESS_STORED_STATE_KEY in state.data\n\n\nasync def test_403_is_not_retried_by_coordinator(hass):\n    response = Mock(status=403, reason=\"Forbidden\")\n    client = make_client(is_logged=True)\n    client.get_measure.side_effect = ideenergy.RequestFailedError(response)\n    state = make_state()\n    coordinator = make_coordinator(hass, client, state)\n    coordinator.dataset_counter[IDeEnergyCoordinatorDataSet.DIRECT_READING.name] = 1\n\n    with pytest.raises(UpdateFailed):\n        await coordinator._async_update_data()\n\n    client.login.assert_not_awaited()\n    client.renew_session.assert_not_awaited()\n    client.get_measure.assert_awaited_once_with()\n    assert DIRECT_READING_LAST_ATTEMPT_STORED_STATE_KEY in state.data\n    assert DIRECT_READING_LAST_SUCCESS_STORED_STATE_KEY not in state.data\n\n\n'''
          if text.count(old_due) != 1:
              raise SystemExit("unexpected coordinator session tests")
          tests.write_text(text.replace(old_due, new_due))
          PY
      - run: python -m pip install --upgrade pre-commit
      - name: Format changed files
        run: pre-commit run --files custom_components/ideenergy/coordinator.py tests/test_coordinator_session.py || true
      - name: Commit clean patch
        run: |
          rm .github/workflows/_tmp_single_auth_boundary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/ideenergy/coordinator.py tests/test_coordinator_session.py .github/workflows/_tmp_single_auth_boundary.yml
          git commit -m "fix: keep authentication recovery in client boundary"
          git push origin HEAD:fix/single-auth-boundary
