name: Temporary apply DST-aware timestamp normalization

on:
  push:
    branches:
      - fix/historical-statistics

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/historical-statistics
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Preserve timezone-aware parser timestamps
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("custom_components/ideenergy/coordinator.py")
          text = path.read_text()

          anchor = 'HISTORICAL_PERIOD_LENGHT = timedelta(days=7)\n\n\n'
          helper = '''HISTORICAL_PERIOD_LENGHT = timedelta(days=7)\n\n\ndef _as_local_datetime(dt: datetime) -> datetime:\n    """Interpret legacy naive values locally while preserving aware timestamps."""\n    if dt.tzinfo is None:\n        return dt.replace(tzinfo=LOCAL_TZ)\n    return dt.astimezone(LOCAL_TZ)\n\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit("unexpected historical-period anchor")
          text = text.replace(anchor, helper)
          text = text.replace(
              '            dt = dai.dt.replace(tzinfo=LOCAL_TZ)\n',
              '            dt = _as_local_datetime(dai.dt)\n',
          )
          text = text.replace(
              '            dt = pv.end.replace(tzinfo=LOCAL_TZ)\n            last_reset = pv.start.replace(tzinfo=LOCAL_TZ)\n',
              '            dt = _as_local_datetime(pv.end)\n            last_reset = _as_local_datetime(pv.start)\n',
          )
          path.write_text(text)
          PY
      - run: python -m pip install --upgrade pre-commit
      - name: Apply repository formatting
        run: pre-commit run --files custom_components/ideenergy/coordinator.py || true
      - name: Commit changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/ideenergy/coordinator.py
          git commit -m "fix: preserve timezone-aware historical timestamps"
          git push origin HEAD:fix/historical-statistics
