name: Temporary finalize historical statistic fixes

on:
  push:
    branches:
      - fix/historical-statistics

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/historical-statistics
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Finalize statistic error handling
        run: |
          python - <<'PY'
          from pathlib import Path

          sensor = Path("custom_components/ideenergy/sensor.py")
          text = sensor.read_text()

          old = "        except KeyError, ValueError:\n"
          new = "        except (KeyError, TypeError, ValueError):\n"
          if text.count(old) != 1:
              raise SystemExit("unexpected statistic exception syntax")
          text = text.replace(old, new)

          old = "statistics broken (lastest={latest!r})"
          new = "statistics broken (latest={latest!r})"
          if text.count(old) != 1:
              raise SystemExit("unexpected latest typo state")
          text = text.replace(old, new)

          old = "def hour_block_for_hist_state(hist_state: HistoricalState) -> datetime:"
          new = "def hour_block_for_hist_state(hist_state: HistoricalState) -> int:"
          if text.count(old) != 1:
              raise SystemExit("unexpected hour-block annotation")
          text = text.replace(old, new)

          old = "(registed at {start_point_local_dt})"
          new = "(registered at {start_point_local_dt})"
          if text.count(old) != 1:
              raise SystemExit("unexpected registered typo state")
          sensor.write_text(text.replace(old, new))
          PY
      - run: python -m pip install --upgrade pre-commit
      - name: Apply repository formatting
        run: pre-commit run --files custom_components/ideenergy/sensor.py tests/test_historical_statistics.py || true
      - name: Commit changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/ideenergy/sensor.py tests/test_historical_statistics.py
          git commit -m "fix: finalize historical statistic handling"
          git push origin HEAD:fix/historical-statistics
