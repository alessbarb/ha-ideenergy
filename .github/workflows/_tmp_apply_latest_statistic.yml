name: Temporary apply latest-statistic reuse

on:
  push:
    branches:
      - fix/historical-statistics

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/historical-statistics
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Reuse historical helper latest statistic
        run: |
          python - <<'PY'
          from pathlib import Path

          sensor = Path("custom_components/ideenergy/sensor.py")
          text = sensor.read_text()
          text = text.replace(
              "from homeassistant_historical_sensor import (\n    HistoricalSensor,\n    HistoricalState,\n    hass_get_last_statistic,\n)\n",
              "from homeassistant_historical_sensor import HistoricalSensor, HistoricalState\n",
          )
          old = "        latest = await hass_get_last_statistic(self.hass, self.get_statistic_metadata())\n\n"
          if text.count(old) != 1:
              raise SystemExit("unexpected latest-statistic lookup")
          sensor.write_text(text.replace(old, ""))

          tests = Path("tests/test_historical_statistics.py")
          tests.write_text('''"""Tests for historical statistic aggregation."""\n\nfrom types import SimpleNamespace\n\nimport pytest\n\nfrom custom_components.ideenergy import sensor\n\npytestmark = pytest.mark.asyncio\n\n\ndef make_subject(hass):\n    """Create the minimal object needed by the statistic calculator."""\n    return SimpleNamespace(\n        hass=hass,\n        entity_id="sensor.test_historical_consumption",\n        get_statistic_metadata=lambda: {"statistic_id": "sensor.test"},\n    )\n\n\ndef historical_state(*, timestamp: float, state: float | None):\n    """Create a minimal historical state value."""\n    return SimpleNamespace(timestamp=timestamp, state=state)\n\n\nasync def test_zero_energy_period_is_preserved(hass):\n    subject = make_subject(hass)\n\n    result = await sensor.IDeEnergySensor.async_calculate_statistic_data(\n        subject,\n        [historical_state(timestamp=3601, state=0)],\n    )\n\n    assert len(result) == 1\n    assert result[0]["state"] == 0\n    assert result[0]["sum"] == 0\n\n\nasync def test_unsorted_periods_are_aggregated_chronologically(hass):\n    subject = make_subject(hass)\n\n    result = await sensor.IDeEnergySensor.async_calculate_statistic_data(\n        subject,\n        [\n            historical_state(timestamp=7201, state=2),\n            historical_state(timestamp=3601, state=1),\n        ],\n    )\n\n    assert [item["state"] for item in result] == [1, 2]\n    assert [item["sum"] for item in result] == [1, 3]\n\n\nasync def test_none_period_is_discarded_without_dropping_zero(hass):\n    subject = make_subject(hass)\n\n    result = await sensor.IDeEnergySensor.async_calculate_statistic_data(\n        subject,\n        [\n            historical_state(timestamp=3601, state=None),\n            historical_state(timestamp=7201, state=0),\n        ],\n    )\n\n    assert len(result) == 1\n    assert result[0]["state"] == 0\n    assert result[0]["sum"] == 0\n\n\nasync def test_latest_sum_is_reused_without_second_recorder_lookup(hass):\n    subject = make_subject(hass)\n\n    result = await sensor.IDeEnergySensor.async_calculate_statistic_data(\n        subject,\n        [historical_state(timestamp=3601, state=2.5)],\n        latest={"start": 0, "sum": 10},\n    )\n\n    assert len(result) == 1\n    assert result[0]["state"] == 2.5\n    assert result[0]["sum"] == 12.5\n''')
          PY
      - run: python -m pip install --upgrade pre-commit
      - name: Apply repository formatting
        run: pre-commit run --files custom_components/ideenergy/sensor.py tests/test_historical_statistics.py || true
      - name: Commit changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/ideenergy/sensor.py tests/test_historical_statistics.py
          git commit -m "fix: reuse latest historical statistic snapshot"
          git push origin HEAD:fix/historical-statistics
