name: Temporary apply coordinator callback suppression

on:
  push:
    branches:
      - fix/session-recovery

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/session-recovery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Suppress unchanged coordinator callbacks
        run: |
          python - <<'PY'
          from pathlib import Path

          coordinator = Path("custom_components/ideenergy/coordinator.py")
          text = coordinator.read_text()
          old = '        super().__init__(hass, LOGGER, name=name, update_interval=update_interval)\n'
          new = '''        super().__init__(\n            hass,\n            LOGGER,\n            name=name,\n            update_interval=update_interval,\n            always_update=False,\n        )\n'''
          if text.count(old) != 1:
              raise SystemExit("unexpected coordinator constructor")
          coordinator.write_text(text.replace(old, new))

          tests = Path("tests/test_coordinator_session.py")
          text = tests.read_text()
          marker = "async def test_unchanged_data_does_not_notify_listeners"
          if marker not in text:
              text += '''\n\nasync def test_unchanged_data_does_not_notify_listeners(hass):\n    client = make_client()\n    coordinator = make_coordinator(hass, client, make_state())\n    listener = Mock()\n    remove_listener = coordinator.async_add_listener(listener)\n\n    await coordinator.async_refresh()\n    listener.reset_mock()\n    await coordinator.async_refresh()\n\n    listener.assert_not_called()\n    client.login.assert_not_awaited()\n    client.renew_session.assert_not_awaited()\n    remove_listener()\n'''
          tests.write_text(text)
          PY
      - run: python -m pip install --upgrade pre-commit
      - name: Apply repository formatting
        run: pre-commit run --files custom_components/ideenergy/coordinator.py tests/test_coordinator_session.py || true
      - name: Commit changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/ideenergy/coordinator.py tests/test_coordinator_session.py
          git commit -m "fix: suppress unchanged coordinator callbacks"
          git push origin HEAD:fix/session-recovery
